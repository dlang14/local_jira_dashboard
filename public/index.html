<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Jira Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c2b3a'/%3E%3Crect x='5' y='7' width='6' height='18' rx='1.5' fill='%237aa2c8'/%3E%3Crect x='13' y='11' width='6' height='14' rx='1.5' fill='%23c9a46c'/%3E%3Crect x='21' y='15' width='6' height='10' rx='1.5' fill='%2367b58a'/%3E%3C/svg%3E" />
    <script>
      /* Runs before first paint so the saved theme never flashes. Keep in sync with
         THEME_STORAGE_KEY / normalizeTheme in logic.js (test/theme.test.mjs runs this exact script). */
      (function () {
        var theme = "system";
        try {
          var saved = localStorage.getItem("localJiraBoard.theme.v1");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Local Jira Board</h1>
          <p class="sub" id="subtitle">Tickets assigned to or reported by you</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="meta" id="last-updated">Not loaded yet</span>
        <div class="theme-toggle" id="theme-toggle" role="radiogroup" aria-label="Color theme">
          <button type="button" role="radio" aria-checked="true" tabindex="0" data-theme-choice="system" aria-label="Theme: System, follows your device setting">System</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="light" aria-label="Theme: Light">Light</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="dark" aria-label="Theme: Dark">Dark</button>
        </div>
        <button type="button" class="btn" id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <section class="filters" aria-label="Filters">
      <label class="grow">
        <span class="sr-only">Search</span>
        <input type="search" id="search" placeholder="Search key, summary, or project" />
      </label>
      <label>
        <span class="sr-only">Role</span>
        <select id="filter-role">
          <option value="both">Assigned or reported</option>
          <option value="assigned">Assigned to me</option>
          <option value="reported">Reported by me</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Type</span>
        <select id="filter-type">
          <option value="">All types</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Priority</span>
        <select id="filter-priority">
          <option value="">All priorities</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Sort within columns</span>
        <select id="sort" title="Sort within columns">
          <option value="updated">Sort: Recently updated</option>
          <option value="assigned">Sort: Recently assigned</option>
          <option value="priority">Sort: Priority</option>
          <option value="key">Sort: Key</option>
          <option value="jira">Sort: Jira order</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="recent-only" />
        <span>Recently assigned to me</span>
      </label>
      <label>
        <span class="sr-only">Assigned window</span>
        <select id="assigned-window" title="Window for the recently assigned view and the New badge">
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="include-done" />
        <span>Include all Done</span>
      </label>
      <label class="check">
        <input type="checkbox" id="swimlanes" />
        <span>Swimlanes</span>
      </label>
    </section>

    <section class="legend" aria-label="Projects">
      <span class="legend-label">Projects</span>
      <div id="project-chips" class="chips" role="group" aria-label="Filter by project"></div>
      <button type="button" class="link-btn hidden" id="reset-colors">Reset colors</button>
    </section>

    <div id="color-pop" class="color-pop hidden" role="dialog" aria-label="Choose a project color">
      <p class="color-pop-title" id="color-pop-title"></p>
      <div id="color-swatches" class="swatches"></div>
      <div class="color-pop-actions">
        <button type="button" class="link-btn" id="color-reset-one">Use default</button>
        <button type="button" class="link-btn" id="color-pop-close">Close</button>
      </div>
    </div>

    <main id="board" class="board" aria-live="polite"></main>

    <div id="drawer-backdrop" class="backdrop hidden"></div>
    <aside id="drawer" class="drawer hidden" aria-hidden="true">
      <div class="drawer-head">
        <a id="drawer-key" class="issue-key" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button type="button" class="icon-btn" id="drawer-close" aria-label="Close">×</button>
      </div>
      <label class="stack">
        Summary
        <textarea id="edit-summary" rows="3"></textarea>
      </label>
      <div class="drawer-grid">
        <label class="stack">
          Priority
          <select id="edit-priority"></select>
        </label>
        <label class="stack">
          Assignee
          <input type="text" id="edit-assignee" placeholder="Search people" autocomplete="off" />
          <div id="assignee-results" class="suggest hidden"></div>
        </label>
      </div>
      <p class="muted" id="drawer-meta"></p>
      <div class="drawer-actions">
        <button type="button" class="btn primary" id="save-issue">Save changes</button>
      </div>
      <section class="comments">
        <h2>Comments</h2>
        <div id="comment-list"></div>
        <label class="stack">
          Add a comment
          <textarea id="new-comment" rows="3" placeholder="Write a comment"></textarea>
        </label>
        <button type="button" class="btn" id="add-comment">Add comment</button>
      </section>
    </aside>

    <div id="picker" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="modal-card">
        <h2 id="picker-title">Choose a transition</h2>
        <p class="muted" id="picker-copy"></p>
        <div id="picker-options" class="stack-gap"></div>
        <button type="button" class="btn" id="picker-cancel">Cancel</button>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="assertive"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
